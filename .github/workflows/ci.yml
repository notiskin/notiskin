name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm audit --omit=dev --audit-level=high

  functions:
    # edge function tests, the database is mocked so nothing touches Supabase
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      # run from supabase/ so Deno uses supabase/deno.json and ignores the root package.json
      - run: deno check functions/*/index.ts
        working-directory: supabase
      - run: deno test --allow-env --allow-net=esm.sh,jsr.io
        working-directory: supabase

  package:
    # integration tests, then builds the unpacked .app so the afterPack check proves no secrets get bundled
    runs-on: macos-latest
    needs: check
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # drives the injector against a fake Notion built with Electron
      - run: npm run test:integration
      - run: npx electron-builder --mac dir --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
