name: Release

# run by hand from the Actions tab after the version bump is merged to main
on:
  workflow_dispatch:

permissions:
  contents: write

# two runs at once could create duplicate releases for the same tag
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-latest
    steps:
      - name: Only release from main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "Releases are cut from main, this run is on ${GITHUB_REF}."
          exit 1
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      # drives the injector against a fake Notion built with Electron
      - run: npm run test:integration
      # never reuse a tag, users may already have that version installed
      - name: Check the version's tag is new
        id: version
        run: |
          version="$(node -p "require('./package.json').version")"
          tag="v${version}"
          if [ -n "$(git ls-remote --tags origin "refs/tags/${tag}")" ]; then
            echo "Tag ${tag} already exists on GitHub. Bump the version in package.json."
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "Releasing ${tag}"
      # electron-builder uploads the dmg and zip in parallel and both try to create the release,
      # so create it first, as a draft nobody can see yet. electron-builder uploads into it
      - name: Create a draft release
        run: gh release create "$TAG" --draft --title "$TAG" --target "$GITHUB_SHA" --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
      # the afterPack hook (scripts/check-bundle.js) fails the build if .env or dev-only files get packaged
      - name: Build and upload
        run: npx electron-builder --mac --publish always -c.publish.releaseType=draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      # only goes public once every file is there, the app's updater reads latest-mac.yml.
      # the expected files are whatever electron-builder made in release/, so new platforms need no edit here
      - name: Publish the release
        run: |
          # one download per chip, a silently skipped arch would leave those users without updates
          for file in "notiskin-${VERSION}-arm64.dmg" "notiskin-${VERSION}-x64.dmg"; do
            if [ ! -f "release/${file}" ]; then
              echo "The build didn't make ${file}, leaving ${TAG} as a draft."
              exit 1
            fi
          done
          assets="$(gh release view "$TAG" --json assets --jq '.assets[].name')"
          for path in release/latest*.yml release/*.dmg release/*.zip release/*.blockmap; do
            [ -f "$path" ] || continue
            file="$(basename "$path")"
            if ! printf '%s\n' "$assets" | grep -qxF "$file"; then
              echo "Missing ${file}, leaving ${TAG} as a draft."
              exit 1
            fi
          done
          if [ ! -f release/latest-mac.yml ]; then
            echo "The build didn't make latest-mac.yml, leaving ${TAG} as a draft."
            exit 1
          fi
          gh release edit "$TAG" --draft=false --latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
